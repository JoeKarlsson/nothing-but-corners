<style>
  :root {
    --screen: #000;
    --osd: #d8d8d8;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;

  #flash, #stage, #burst, #banner {
    position: fixed;

  #flash { opacity: 0; }
  #burst, #aura { width: 100%; height: 100%; }
  #aura { position: absolute; inset: 0; }
  #banner {

  #osd {

  #controls button,

  #controls button:focus-visible { outline: 2px solid var(--osd); outline-offset: 2px; }
</style>

<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <defs>

    </mask>

</svg>
<template id="logo-template">

    <svg viewBox="0 0 200 100" fill="currentColor">
      <g transform="translate(15 0) skewX(-15)">
        <text x="100" y="62" text-anchor="middle" font-family="'Archivo Black', 'Arial Black', sans-serif"
              font-size="66" textLength="176" lengthAdjust="spacingAndGlyphs">DVD</text>

</template>
<div id="flash"></div>
<div id="stage"><canvas id="aura"></canvas></div>
<canvas id="burst"></canvas>
<div id="banner"><span id="banner-text"></span></div>
<div id="osd">
  <span id="count" aria-live="polite">0 corners</span>
  <div id="controls">
    <button id="sound" type="button" aria-label="Turn sound on" title="Sound (S)">

    <button id="fullscreen" type="button" aria-label="Full screen" title="Full screen (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path class="icon-detail" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
      </svg>

  </div>
</div>

<script type="module">
import { fold, planCornerRun, planJackpotRuns } from "./path.js?v=7cbfd074";
import { brake as brakeCurve, pickDifferent, along } from "./motion.js?v=ddaa6305";

const COLORS = ["#ff4fd8", "#ff8a1f", "#ffe600", "#00e5ff", "#39ff6a", "#ff2b2b", "#ffffff"];
const SOUND_FILES = {
  cheers: ["kids", "kids-yay", "applause", "yay"].map((name) => `sounds/cheer-${name}.mp3`),
  jamWarble: "sounds/jam-warble.mp3",
  jamStutter: "sounds/jam-stutter.mp3",
  mergeWhoosh: "sounds/merge-whoosh.mp3",
  giantHorn: "sounds/giant-horn.mp3",
  giantImpact: "sounds/giant-impact.mp3",
};
// Cartoon timing: hold full speed, brake late and hard into the corner
// (slow in), then snap out fast and settle back to cruising speed.
const SLOWMO_WINDOW_SECONDS = 0.12;
const SLOWMO_FLOOR = 0.18;
const RICOCHET_BOOST = 1.9;
const RICOCHET_SETTLE_SECONDS = 0.22;
const MAX_FRAME_SECONDS = 0.05;
const GRAVITY = 1400;
// Rare event: every logo on screen hits a corner in the same instant.
const JACKPOT_CHANCE = 1 / 35;
const JACKPOT_MIN_LOGOS = 4;
// Too many logos: the player jams, then a ki blast. Every logo streams into
// one energy ball, it squeezes back, fires a giant logo into a corner, and
// the corner explodes. Long build, short release, long reaction.
const OVERLOAD_LOGOS = 50;
const JAM_MS = 1500;
const CHARGE_MS = 2000; // logos stream into the ball, then it crackles at full size
const STREAM_MS = 1400; // when the last logo has been absorbed
const SQUEEZE_MS = 260; // anticipation: the ball shrinks back, everything freezes, silence
const FIRE_MS = 170; // the giant logo blasts across the screen
const BOUNCE_MS = 420; // each bounce between the four corners
const TO_MIDDLE_MS = 520; // off the fourth corner, braking to a dead stop in the middle
const WINDUP_MS = 900; // stopped in the middle, winding up and swelling into a leviathan
// The leviathan: nearly screen-sized, drifting at one slow, steady speed
// (a fraction of the screen diagonal per second) into two corners.
const LEVIATHAN_SPEED = 0.085;
const LEVIATHAN_IMPACT = [["#ff2b2b", "#000"], ["#000", "#ff2b2b"], ["#ff2b2b", "#000"]];
const IMPACT_FRAME_MS = 50; // each flat two-color impact frame
const DOME_EXPAND_MS = 520;
const DOME_HOLD_MS = 450;
const DOME_FADE_MS = 1000;
const SHATTER_HOLD_MS = 450; // the second corner: shards strobe in place
const SHATTER_FLY_MS = 1100; // then fly apart and fall away
// Impact frames as [background, ink] pairs: black and white for the first
// corner, loud colors for the second.
// Each of the four bounce corners gets its own pair; the final corner gets
// the loudest set.
const BOUNCE_IMPACTS = [
  [["#fff", "#000"], ["#000", "#fff"], ["#fff", "#000"]],
  [["#ff4fd8", "#000"], ["#000", "#ff4fd8"], ["#ff4fd8", "#000"]],
  [["#ffe600", "#000"], ["#000", "#ffe600"], ["#ffe600", "#000"]],
  [["#00e5ff", "#000"], ["#000", "#00e5ff"], ["#00e5ff", "#000"]],
];
const FINAL_IMPACT = [["#ff4fd8", "#000"], ["#000", "#ffe600"], ["#ffe600", "#000"], ["#000", "#ff4fd8"], ["#fff", "#000"]];
const SHARD_COLORS = ["#ff4fd8", "#ffffff", "#ffe600", "#00e5ff", "#ff8a1f", "#000000"];
const KI = { aura: "#ff4fd8", ring: "#ffe600", core: "#ffffff" };
const DOME_LAYERS = [[1, "#ff2b2b"], [0.84, "#ff8a1f"], [0.68, "#ff4fd8"], [0.5, "#ffe600"], [0.32, "#ffffff"]];

const stage = document.getElementById("stage");
const flash = document.getElementById("flash");
const banner = document.getElementById("banner");
const bannerText = document.getElementById("banner-text");
const burstCanvas = document.getElementById("burst");
const burst = burstCanvas.getContext("2d");
const auraCanvas = document.getElementById("aura");
const aura = auraCanvas.getContext("2d");
const countLabel = document.getElementById("count");
const soundButton = document.getElementById("sound");
const fullscreenButton = document.getElementById("fullscreen");
const logoTemplate = document.getElementById("logo-template");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

let width, height, speed, logoWidth, logoHeight;
let corners = 0;
let lastTime = performance.now();
let logos = [];
const particles = [];
const rings = [];
const rocks = []; // debris floating up while the ball charges
let charge = null; // the energy ball while logos stream in
let blast = null; // the beam behind the giant logo as it fires
let impactFlash = null; // { start, x, y, frames } the flat-color impact frames
const domes = []; // the first corner's explosion and its chain explosions
let shatter = null; // the second corner's explosion
let effectsOnCanvas = false;
let auraOnCanvas = false;
let mode = "play"; // play, jam, charge, fire, bounce, windup, drift, landing
let jackpot = null;
let giant = null;

// Milliseconds since an effect started. Effects that start partway through a
// frame record a start a hair after that frame's timestamp, so never negative.
const since = (start, now) => Math.max(0, now - start);
const brake = (secondsLeft, window = SLOWMO_WINDOW_SECONDS) => brakeCurve(secondsLeft, window, SLOWMO_FLOOR);
const randomColorIndex = (except) => pickDifferent(COLORS.length, except);

function measure() {
  const probe = createLogoElement();
  probe.style.visibility = "hidden";
  ({ width: logoWidth, height: logoHeight } = probe.getBoundingClientRect());
  probe.remove();
  width = Math.max(1, innerWidth - logoWidth);
  height = Math.max(1, innerHeight - logoHeight);
  speed = 0.2 * Math.hypot(innerWidth, innerHeight);
  const scale = devicePixelRatio || 1;
  for (const [canvas, context] of [[burstCanvas, burst], [auraCanvas, aura]]) {
    canvas.width = innerWidth * scale;
    canvas.height = innerHeight * scale;
    context.setTransform(scale, 0, 0, scale, 0, 0);
  }
}

function createLogoElement() {
  const element = logoTemplate.content.firstElementChild.cloneNode(true);
  stage.append(element);
  return element;
}

function addLogo(x, y) {
  const element = createLogoElement();
  const logo = { element, svg: element.firstElementChild, x, y, colorIndex: randomColorIndex(-1), boost: 0, trail: [] };
  element.style.color = COLORS[logo.colorIndex];
  logos.push(logo);
  startRun(logo);
  draw(logo);
  return logo;
}

function popIn(svg) {
  if (reduceMotion) return;
  svg.animate([{ transform: "scale(0)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }],
    { duration: 280, easing: "ease-out" });
}

function startRun(logo) {
  logo.run = planCornerRun(logo.x, logo.y, width, height);
  logo.travelled = 0;
  logo.nextBounce = 0;
}

function recolor(logo) {
  logo.colorIndex = randomColorIndex(logo.colorIndex);
  logo.element.style.color = COLORS[logo.colorIndex];
}

function draw(logo) {
  const x = fold(logo.x, width);
  const y = fold(logo.y, height);
  logo.element.style.transform = `translate(${x}px, ${y}px)`;
  logo.trail.push([x, y]);
  if (logo.trail.length > 12) logo.trail.shift();
}

function updateCount() {
  countLabel.textContent = corners === 1 ? "1 corner" : `${corners} corners`;
  if (!reduceMotion) {
    countLabel.animate([{ transform: "scale(1.6)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
  }
}

// ---- Hit effects ----

// Squash flat along the way it came in, then stretch along the way it leaves.
function squashAndStretch(svg, inAngle, outAngle, left, top, color) {
  if (reduceMotion) return;
  svg.style.transformOrigin = `${left ? 0 : 100}% ${top ? 0 : 100}%`;
  svg.animate(
    [
      { transform: along(inAngle, 0.6, 1.28), color: "#000" },
      { transform: along(outAngle, 1.32, 0.78), color: "#000", offset: 0.22 },
      { transform: along(outAngle, 0.92, 1.07), color, offset: 0.5 },
      { transform: along(outAngle, 1.03, 0.98), color, offset: 0.75 },
      { transform: along(outAngle, 1, 1), color },
    ],
    { duration: 560, easing: "ease-out" }
  );
}

function flashScreen(colors, duration) {
  if (reduceMotion) return;
  const frames = colors.length === 1
    ? [{ opacity: 1, background: colors[0] }, { opacity: 1, background: colors[0], offset: 0.12 }, { opacity: 0, background: colors[0] }]
    : [...colors.map((background) => ({ opacity: 1, background })), { opacity: 0, background: colors.at(-1) }];
  flash.animate(frames, { duration, easing: colors.length === 1 ? "ease-out" : "steps(1, end)" });
}

function shakeStage(towardX, towardY, kick) {
  if (reduceMotion) return;
  for (const layer of [stage, burstCanvas]) layer.animate(
    [
      { transform: `translate(${towardX * kick}px, ${towardY * kick}px)` },
      { transform: `translate(${-towardX * kick * 0.5}px, ${-towardY * kick * 0.5}px)` },
      { transform: `translate(${towardX * kick * 0.25}px, ${towardY * kick * 0.25}px)` },
      { transform: "translate(0, 0)" },
    ],
    { duration: 320 + kick * 4, easing: "ease-out" }
  );
}

function showBanner(text) {
  if (reduceMotion) return;
  bannerText.textContent = text;
  banner.animate(
    [
      { opacity: 1, transform: "scale(0.2) rotate(-8deg)" },
      { opacity: 1, transform: "scale(1.15) rotate(3deg)", offset: 0.15 },
      { opacity: 1, transform: "scale(1) rotate(0)", offset: 0.25 },
      { opacity: 1, transform: "scale(1)", offset: 0.8 },
      { opacity: 0, transform: "scale(1.05)" },
    ],
    { duration: 1800, easing: "ease-out" }
  );
  bannerText.animate(COLORS.map((color) => ({ color })), { duration: 1800, easing: "steps(7, end)" });
}

function sprayConfetti(left, top, count) {
  spray(left ? 0 : innerWidth, top ? 0 : innerHeight, Math.atan2(top ? 1 : -1, left ? 1 : -1), 1.5, count);
}

function spray(x, y, aim, spread, count, power = 1) {
  if (reduceMotion) return;
  const reach = Math.hypot(innerWidth, innerHeight) * power;
  for (let i = 0; i < count; i++) {
    const angle = aim + (Math.random() - 0.5) * spread;
    const launch = reach * (0.35 + Math.random() * 0.75);
    particles.push({
      x, y,
      vx: Math.cos(angle) * launch,
      vy: Math.sin(angle) * launch,
      size: 5 + Math.random() * 9,
      spin: Math.random() * Math.PI,
      spinRate: (Math.random() - 0.5) * 20,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }
}

// The top canvas: the explosion dome, impact starburst, shockwaves, confetti.
function renderEffects(now, seconds) {
  const active = particles.length || rings.length || domes.length || shatter || impactFlash;
  if (!active && !effectsOnCanvas) return;
  burst.clearRect(0, 0, innerWidth, innerHeight);
  effectsOnCanvas = Boolean(active);
  for (const dome of [...domes]) drawDome(dome, now);
  if (shatter) drawShatter(now);
  if (impactFlash) drawImpactFlash(now);
  updateRings(seconds);
  updateParticles(seconds);
}

// The canvas under the logos: rising rocks, the energy ball and the beam.
function renderAura(now, seconds) {
  const active = charge || blast || rocks.length;
  if (!active && !auraOnCanvas) return;
  aura.clearRect(0, 0, innerWidth, innerHeight);
  auraOnCanvas = Boolean(active);
  updateRocks(seconds);
  if (blast) drawBeam(now);
  if (charge) drawCharge(now);
}

function updateParticles(seconds) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vx *= 1 - 1.6 * seconds;
    p.vy = p.vy * (1 - 1.6 * seconds) + GRAVITY * seconds;
    p.x += p.vx * seconds;
    p.y += p.vy * seconds;
    p.spin += p.spinRate * seconds;
    if (p.y > innerHeight + 40 || p.x < -40 || p.x > innerWidth + 40) {
      particles.splice(i, 1);
      continue;
    }
    burst.save();
    burst.translate(p.x, p.y);
    burst.rotate(p.spin);
    burst.fillStyle = p.color;
    burst.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    burst.restore();
  }
}

function updateRings(seconds) {
  const outer = Math.hypot(innerWidth, innerHeight);
  for (let i = rings.length - 1; i >= 0; i--) {
    const ring = rings[i];
    ring.radius += ring.speed * seconds;
    ring.speed *= 1 - 1.2 * seconds;
    ring.width *= 1 - 2.2 * seconds;
    if (ring.radius > outer || ring.width < 0.5) {
      rings.splice(i, 1);
      continue;
    }
    burst.strokeStyle = ring.color;
    burst.lineWidth = ring.width;
    burst.beginPath();
    burst.arc(ring.x, ring.y, ring.radius, 0, Math.PI * 2);
    burst.stroke();
  }
}

// A circle with a rough, flame-like edge, redrawn every frame so it flickers.
function jaggedCircle(context, x, y, radius, roughness, color, points = 30) {
  context.fillStyle = color;
  context.beginPath();
  for (let i = 0; i <= points; i++) {
    const angle = (i / points) * Math.PI * 2;
    const r = radius * (1 - roughness / 2 + Math.random() * roughness);
    if (i === 0) context.moveTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r);
    else context.lineTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r);
  }
  context.fill();
}

// ---- Normal play ----

function moveLogo(logo, seconds) {
  let progress;
  if (jackpot?.logos.has(logo)) {
    progress = jackpot.progress;
  } else {
    // Brake hard in the last few inches so everyone gets to lean in.
    const secondsLeft = (logo.run.length - logo.travelled) / speed;
    // After a hit, the ricochet boost decays back to cruising speed.
    logo.boost *= Math.exp(-seconds / RICOCHET_SETTLE_SECONDS);
    logo.travelled += speed * seconds * brake(secondsLeft) * (1 + logo.boost);
    progress = Math.min(logo.travelled / logo.run.length, 1);
  }
  while (logo.nextBounce < logo.run.bounces.length && logo.run.bounces[logo.nextBounce] <= progress) {
    logo.nextBounce += 1;
    recolor(logo);
  }
  logo.x = logo.run.x0 + (logo.run.x1 - logo.run.x0) * progress;
  logo.y = logo.run.y0 + (logo.run.y1 - logo.run.y0) * progress;
  draw(logo);
  if (progress === 1) hitCorner(logo);
}

function hitCorner(logo) {
  const incoming = logo.run;
  startRun(logo);
  logo.boost = RICOCHET_BOOST;
  recolor(logo);
  const color = COLORS[logo.colorIndex];
  const left = fold(logo.x, width) < width / 2;
  const top = fold(logo.y, height) < height / 2;
  const towardX = left ? -1 : 1;
  const towardY = top ? -1 : 1;
  const inAngle = Math.atan2(towardY * Math.abs(incoming.y1 - incoming.y0), towardX * Math.abs(incoming.x1 - incoming.x0));
  const outAngle = Math.atan2(-towardY * Math.abs(logo.run.y1 - logo.run.y0), -towardX * Math.abs(logo.run.x1 - logo.run.x0));
  squashAndStretch(logo.svg, inAngle, outAngle, left, top, color);

  if (jackpot?.logos.has(logo)) {
    jackpot.logos.delete(logo);
    jackpot.arrivals.push({ left, top });
    return;
  }
  corners += 1;
  updateCount();
  navigator.vibrate?.(35);
  playCornerSound();
  flashScreen([color], 560);
  shakeStage(towardX, towardY, 18);
  sprayConfetti(left, top, 80);
  if (!jackpot && Math.random() < JACKPOT_CHANCE) startJackpot();
}

// ---- Rare event: jackpot ----

function startJackpot() {
  while (logos.length < JACKPOT_MIN_LOGOS) {
    popIn(addLogo(Math.random() * width, Math.random() * height).svg);
  }
  // Give every logo a run of about the same length, then move them all on
  // one shared clock so they land together.
  const runs = planJackpotRuns(logos.map((logo) => [logo.x, logo.y]), width, height, 1.4 * Math.hypot(width, height));
  logos.forEach((logo, i) => {
    logo.run = runs[i];
    logo.travelled = 0;
    logo.nextBounce = 0;
  });
  jackpot = {
    length: Math.max(...logos.map((logo) => logo.run.length)),
    progress: 0,
    logos: new Set(logos),
    arrivals: [],
  };
}

function advanceJackpot(seconds) {
  const secondsLeft = ((1 - jackpot.progress) * jackpot.length) / speed;
  jackpot.progress = Math.min(1, jackpot.progress + (speed * seconds * brake(secondsLeft)) / jackpot.length);
}

function jackpotFinale() {
  const { arrivals } = jackpot;
  jackpot = null;
  corners += arrivals.length;
  updateCount();
  navigator.vibrate?.([60, 40, 60, 40, 120]);
  playJackpotSound();
  showBanner("Jackpot");
  flashScreen([...COLORS, ...COLORS], 1100);
  shakeStage(Math.random() < 0.5 ? -1 : 1, Math.random() < 0.5 ? -1 : 1, 34);
  for (const { left, top } of arrivals) sprayConfetti(left, top, 140);
}

// ---- Too many logos: jam, merge, one giant hit ----

function startJam() {
  mode = "jam";
  jackpot = null;
  playJamSound();
  // Scratched disc: every logo skips back and forth between recent frames.
  let beat = 0;
  const stutter = setInterval(() => {
    beat += 1;
    for (const logo of logos) {
      const back = beat % 2 ? 0 : beat % 5 ? 6 : 11;
      const [x, y] = logo.trail[Math.max(0, logo.trail.length - 1 - back)];
      logo.element.style.transform = `translate(${x}px, ${y}px)`;
    }
    if (!reduceMotion) {
      stage.style.transform = `translate(${(Math.random() - 0.5) * 16}px, ${(Math.random() - 0.5) * 10}px)`;
      if (beat % 4 === 0) flashScreen([COLORS[beat % COLORS.length]], 120);
    }
  }, 80);
  setTimeout(() => {
    clearInterval(stutter);
    stage.style.transform = "";
    startCharge();
  }, JAM_MS);
}

// Charge: every logo streams into one energy ball in the middle, one after
// another. The ball grows with each one, crackles with lightning, rocks float
// up off the floor, and the screen rumbles harder and harder.
function startCharge() {
  mode = "charge";
  const fullRadius = Math.min(innerWidth, innerHeight) * 0.15;
  charge = { start: performance.now(), radius: 4, target: 4, pulse: 0, squeezeStart: null };
  playChargeSound();
  const centerX = (innerWidth - logoWidth) / 2;
  const centerY = (innerHeight - logoHeight) / 2;
  const absorbed = logos;
  logos = [];
  absorbed.forEach((logo, i) => {
    const [x, y] = logo.trail.at(-1);
    const delay = (i / absorbed.length) * (STREAM_MS - 400) + Math.random() * 120;
    const duration = 380;
    if (!reduceMotion) {
      logo.element.animate(
        [
          { transform: `translate(${x}px, ${y}px) scale(1)` },
          { transform: `translate(${x + (x - centerX) * 0.1}px, ${y + (y - centerY) * 0.1}px) scale(1.1)`, offset: 0.3 },
          { transform: `translate(${centerX}px, ${centerY}px) scale(0.05)`, color: "#fff" },
        ],
        { duration, delay, easing: "cubic-bezier(.6, 0, .9, .4)", fill: "forwards" }
      );
    }
    setTimeout(() => {
      logo.element.remove();
      charge.target += (fullRadius - 4) / absorbed.length;
      charge.pulse = performance.now();
      if (i % 5 === 0) playThump(0.6);
    }, delay + duration);
  });
  setTimeout(squeeze, CHARGE_MS);
}

function drawCharge(now) {
  const x = innerWidth / 2;
  const y = innerHeight / 2;
  let radius;
  if (charge.squeezeStart === null) {
    charge.radius += (charge.target - charge.radius) * 0.2;
    const pulse = Math.max(0, 1 - since(charge.pulse, now) / 140);
    radius = charge.radius * (1 + 0.22 * pulse + 0.04 * Math.sin(since(charge.start, now) / 35));
    const power = charge.radius / (Math.min(innerWidth, innerHeight) * 0.15);
    if (!reduceMotion) {
      const shake = 1 + 10 * power * power;
      stage.style.transform = `translate(${(Math.random() - 0.5) * shake}px, ${(Math.random() - 0.5) * shake}px)`;
      drawLightning(x, y, radius, 2 + Math.floor(power * 4));
      if (Math.random() < 0.3 + power) spawnRock();
    }
    charge.auraRoughness = 0.35;
  } else {
    // Squeeze: shrink back fast and hold still. Nothing moves, nothing sounds.
    const s = Math.min(1, since(charge.squeezeStart, now) / SQUEEZE_MS);
    radius = charge.radius * (1 - 0.4 * (1 - (1 - s) ** 3));
    charge.auraRoughness = 0.12;
  }
  jaggedCircle(aura, x, y, radius * 1.5, charge.auraRoughness, KI.aura);
  jaggedCircle(aura, x, y, radius * 1.12, 0.1, KI.ring, 24);
  aura.fillStyle = KI.core;
  aura.beginPath();
  aura.arc(x, y, radius * 0.8, 0, Math.PI * 2);
  aura.fill();
}

function drawLightning(x, y, radius, bolts) {
  aura.strokeStyle = "#fff";
  aura.lineWidth = 2.5;
  aura.lineJoin = "miter";
  for (let b = 0; b < bolts; b++) {
    let angle = Math.random() * Math.PI * 2;
    let distance = radius * 0.9;
    const reach = radius * (1.6 + Math.random() * 1.6);
    aura.beginPath();
    aura.moveTo(x + Math.cos(angle) * distance, y + Math.sin(angle) * distance);
    while (distance < reach) {
      distance += reach / 6;
      angle += (Math.random() - 0.5) * 0.5;
      aura.lineTo(x + Math.cos(angle) * distance, y + Math.sin(angle) * distance);
    }
    aura.stroke();
  }
}

function spawnRock() {
  rocks.push({
    x: Math.random() * innerWidth,
    y: innerHeight + 12,
    vy: -(50 + Math.random() * 130),
    size: 4 + Math.random() * 10,
    spin: Math.random() * Math.PI,
    falling: false,
  });
}

// Rocks drift up while charging, hold still during the squeeze, and drop
// once the blast goes off.
function updateRocks(seconds) {
  const frozen = charge?.squeezeStart != null;
  for (let i = rocks.length - 1; i >= 0; i--) {
    const rock = rocks[i];
    if (!frozen) {
      if (rock.falling) rock.vy += GRAVITY * seconds;
      rock.y += rock.vy * seconds;
      rock.spin += seconds * 2;
    }
    if (rock.y > innerHeight + 20 || rock.y < -20) {
      rocks.splice(i, 1);
      continue;
    }
    const jitter = frozen || rock.falling ? 0 : (Math.random() - 0.5) * 3;
    aura.save();
    aura.translate(rock.x + jitter, rock.y);
    aura.rotate(rock.spin);
    aura.fillStyle = "#9a9a9a";
    aura.fillRect(-rock.size / 2, -rock.size / 2, rock.size, rock.size * 0.7);
    aura.restore();
  }
}

function squeeze() {
  charge.squeezeStart = performance.now();
  stage.style.transform = "";
  setTimeout(fire, SQUEEZE_MS);
}

// Fire: the giant logo blasts out of the ball toward a corner, stretched
// along its path, trailing a beam.
function fire() {
  const ballRadius = charge.radius * 0.6;
  charge = null;
  for (const rock of rocks) rock.falling = true;
  // The giant sits above the effects canvas so it stays visible in front of
  // its own explosions.
  const element = createLogoElement();
  document.body.append(element);
  element.style.position = "fixed";
  element.style.zIndex = "1";
  const giantWidth = Math.min(innerWidth * 0.5, innerHeight * 0.9);
  const giantHeight = giantWidth / 2;
  element.style.width = `${giantWidth}px`;
  element.style.color = KI.core;
  giant = { element, svg: element.firstElementChild, width: giantWidth, height: giantHeight, hits: 0 };
  const middle = giantMiddle();
  giant.x = middle.x;
  giant.y = middle.y;
  blast = { start: performance.now(), width: ballRadius * 2, thinning: null };
  mode = "fire";
  playFireSound();
  const left = Math.random() < 0.5;
  const top = Math.random() < 0.5;
  // The tour: fire into one corner, then the opposite one, then swing over
  // to a neighbor, then its opposite. All four, in a bowtie.
  giant.tour = [[left, top], [!left, !top], [!left, top], [left, !top]];
  sendGiant(giantCorner(left, top), FIRE_MS, (p) => p * p, () => bounceCorner(0));
}

const giantMiddle = () => ({ x: (innerWidth - giant.width) / 2, y: (innerHeight - giant.height) / 2 });
const giantCorner = (left, top) => ({ x: left ? 0 : innerWidth - giant.width, y: top ? 0 : innerHeight - giant.height, left, top });

// Move the giant along one leg. Legs between neighboring corners curve
// through the middle of the screen (an arc) instead of sliding along a wall.
function sendGiant(to, duration, ease, onArrive, curve = false) {
  const from = { x: giant.x, y: giant.y };
  const middle = giantMiddle();
  const halfway = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
  const control = curve
    ? { x: halfway.x + (middle.x - halfway.x) * 1.2, y: halfway.y + (middle.y - halfway.y) * 1.2 }
    : halfway;
  giant.leg = { from, to, control, start: performance.now(), duration, ease, onArrive };
}

function moveGiant(now) {
  const { from, to, control, start, duration, ease, onArrive } = giant.leg;
  const progress = Math.min(1, since(start, now) / duration);
  const e = ease(progress);
  const x = (1 - e) ** 2 * from.x + 2 * (1 - e) * e * control.x + e * e * to.x;
  const y = (1 - e) ** 2 * from.y + 2 * (1 - e) * e * control.y + e * e * to.y;
  // Stretch along the direction of travel, more the faster it goes.
  const step = Math.hypot(x - giant.x, y - giant.y);
  const smear = reduceMotion ? 0 : Math.min(1, step / 45);
  if (step > 0.01) giant.angle = Math.atan2(y - giant.y, x - giant.x);
  giant.x = x;
  giant.y = y;
  giant.element.style.transform = `translate(${x}px, ${y}px)`;
  giant.svg.style.transformOrigin = "50% 50%";
  // The leviathan sways slowly as it drifts, and the ground trembles under it.
  const sway = giant.leviathan && !reduceMotion ? ` rotate(${Math.sin(now / 700) * 1.5}deg)` : "";
  giant.svg.style.transform = along(giant.angle ?? 0, 1 + 0.8 * smear, 1 - 0.25 * smear) + sway;
  if (giant.leviathan && !reduceMotion) stage.style.transform = `translate(${(Math.random() - 0.5) * 3}px, ${(Math.random() - 0.5) * 3}px)`;
  giant.tipX = x + giant.width / 2;
  giant.tipY = y + giant.height / 2;
  if (progress === 1) {
    giant.leg = null;
    giant.svg.style.transform = "";
    onArrive(now);
  }
}

function countGiantCorner() {
  giant.hits += 1;
  corners += 1;
  updateCount();
}

// Bounce corners: impact frames in that corner's colors, a dome explosion,
// and the giant launches straight on toward the next corner of the tour.
function bounceCorner(index) {
  mode = "bounce";
  const now = performance.now();
  const [left, top] = giant.tour[index];
  countGiantCorner();
  domes.length = 0; // each hit blows the last explosion away
  navigator.vibrate?.([150, 40, 150]);
  playBounceCornerSound();
  if (blast) blast.thinning ??= now;
  const cornerX = left ? 0 : innerWidth;
  const cornerY = top ? 0 : innerHeight;
  const frames = BOUNCE_IMPACTS[index];
  if (!reduceMotion) impactFlash = { start: now, x: cornerX, y: cornerY, frames };
  setTimeout(() => {
    startDomes(cornerX, cornerY);
    if (index < giant.tour.length - 1) {
      const [nextLeft, nextTop] = giant.tour[index + 1];
      const neighbor = nextLeft === left || nextTop === top;
      sendGiant(giantCorner(nextLeft, nextTop), BOUNCE_MS, (p) => 1 - (1 - p) ** 1.6, () => bounceCorner(index + 1), neighbor);
    } else {
      // Off the last corner, back to the middle, braking to a dead stop.
      sendGiant(giantMiddle(), TO_MIDDLE_MS, (p) => 1 - (1 - p) ** 3, windUp);
    }
  }, IMPACT_FRAME_MS * frames.length);
}

// Stopped dead in the middle: squash down and tremble while the sound builds
// (anticipation), and swell into a leviathan.
function windUp() {
  mode = "windup";
  playWindUpSound();
  giant.growth = {
    start: performance.now(),
    from: giant.width,
    to: Math.min(innerWidth * 0.82, innerHeight * 1.5),
  };
  if (!reduceMotion) {
    const shake = Array.from({ length: 18 }, (_, i) => {
      const t = i / 17;
      const jitter = 2 + 10 * t;
      return {
        offset: t,
        transform: `translate(${(Math.random() - 0.5) * jitter}px, ${(Math.random() - 0.5) * jitter}px) scale(${1 - 0.18 * t}, ${1 - 0.1 * t})`,
      };
    });
    shake[shake.length - 1].transform = "translate(0, 0) scale(0.82, 0.9)";
    giant.svg.style.transformOrigin = "50% 50%";
    giant.svg.animate(shake, { duration: WINDUP_MS, fill: "forwards" });
  }
  setTimeout(drift, WINDUP_MS);
}

// Grow from the middle outward while it winds up.
function growGiant(now) {
  const { start, from, to } = giant.growth;
  const t = Math.min(1, since(start, now) / WINDUP_MS);
  giant.width = from + (to - from) * (1 - (1 - t) ** 3);
  giant.height = giant.width / 2;
  giant.element.style.width = `${giant.width}px`;
  const middle = giantMiddle();
  giant.x = middle.x;
  giant.y = middle.y;
  giant.element.style.transform = `translate(${middle.x}px, ${middle.y}px)`;
  if (t === 1) giant.growth = null;
}

// The leviathan drifts into one corner and on into the opposite one, at one
// slow, steady speed the whole way: no braking, no rush.
function drift() {
  mode = "drift";
  if (giant.growth) growGiant(giant.growth.start + WINDUP_MS); // finish growing exactly
  giant.svg.getAnimations().forEach((animation) => animation.cancel());
  giant.leviathan = true;
  playLeviathanSound();
  const left = Math.random() < 0.5;
  const top = Math.random() < 0.5;
  const pace = LEVIATHAN_SPEED * Math.hypot(innerWidth, innerHeight);
  const steady = (p) => p;
  const durationTo = (to) => (Math.hypot(to.x - giant.x, to.y - giant.y) / pace) * 1000;
  const first = giantCorner(left, top);
  sendGiant(first, durationTo(first), steady, () => {
    leviathanCorner(left, top);
    const second = giantCorner(!left, !top);
    sendGiant(second, durationTo(second), steady, () => finalCorner(!left, !top));
  });
}

// The leviathan's first corner: red impact frames and a dome explosion
// behind it, and it keeps drifting on without changing pace.
function leviathanCorner(left, top) {
  const now = performance.now();
  countGiantCorner();
  domes.length = 0;
  navigator.vibrate?.([250, 60, 250]);
  playBounceCornerSound();
  playThump(3);
  const cornerX = left ? 0 : innerWidth;
  const cornerY = top ? 0 : innerHeight;
  if (!reduceMotion) impactFlash = { start: now, x: cornerX, y: cornerY, frames: LEVIATHAN_IMPACT };
  setTimeout(() => startDomes(cornerX, cornerY), IMPACT_FRAME_MS * LEVIATHAN_IMPACT.length);
}

// The last corner: the loudest impact frames, then the shatter.
function finalCorner(left, top) {
  mode = "landing";
  const now = performance.now();
  giant.leviathan = false;
  stage.style.transform = "";
  giant.drone?.stop();
  giant.left = left;
  giant.top = top;
  countGiantCorner();
  domes.length = 0;
  navigator.vibrate?.([300, 60, 400]);
  playGiantSound();
  const cornerX = left ? 0 : innerWidth;
  const cornerY = top ? 0 : innerHeight;
  if (!reduceMotion) impactFlash = { start: now, x: cornerX, y: cornerY, frames: FINAL_IMPACT };
  setTimeout(() => startShatter(cornerX, cornerY), IMPACT_FRAME_MS * FINAL_IMPACT.length);
}

function drawBeam(now) {
  let width = blast.width;
  if (blast.thinning !== null) {
    const t = Math.min(1, since(blast.thinning, now) / 180);
    width *= 1 - t;
    if (t === 1) {
      blast = null;
      return;
    }
  }
  const fromX = innerWidth / 2;
  const fromY = innerHeight / 2;
  aura.lineCap = "round";
  for (const [scale, color] of [[1.4, KI.aura], [1, KI.ring], [0.55, KI.core]]) {
    aura.strokeStyle = color;
    aura.lineWidth = width * scale;
    aura.beginPath();
    aura.moveTo(fromX, fromY);
    aura.lineTo(giant.tipX, giant.tipY);
    aura.stroke();
  }
}

// Impact frames: the whole screen in two flat colors, swapping each frame.
// The background, the giant and the starburst all switch on the same frame.
function drawImpactFlash(now) {
  const { start, x, y, frames } = impactFlash;
  const frame = Math.floor(since(start, now) / IMPACT_FRAME_MS);
  if (frame >= frames.length) {
    impactFlash = null;
    flash.style.opacity = "";
    giant.element.style.color = KI.core;
    return;
  }
  const [background, ink] = frames[frame];
  flash.style.opacity = "1";
  flash.style.background = background;
  giant.element.style.color = ink;
  const reach = Math.hypot(innerWidth, innerHeight);
  burst.fillStyle = ink;
  burst.beginPath();
  for (let i = 0; i <= 24; i++) {
    const angle = (i / 24) * Math.PI * 2;
    const r = i % 2 ? reach * (0.15 + Math.random() * 0.15) : reach * (0.5 + Math.random() * 0.5);
    if (i === 0) burst.moveTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r);
    else burst.lineTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r);
  }
  burst.fill();
}

// A bounce explosion: one dome bigger than the screen, then three more
// popping off along the edges a beat apart.
function startDomes(x, y) {
  const reach = Math.hypot(innerWidth, innerHeight);
  const hit = giant.hits;
  domes.push({ start: performance.now(), x, y, radius: reach * 1.15, puffs: null });
  if (reduceMotion) return;
  shakeStage(x ? 1 : -1, y ? 1 : -1, 70);
  rings.push({ x, y, radius: 0, speed: 3400, width: 48, color: "#fff" });
  rings.push({ x, y, radius: 0, speed: 2400, width: 28, color: KI.aura });
  rings.push({ x, y, radius: 0, speed: 1600, width: 16, color: KI.ring });
  spray(x, y, Math.atan2(y ? -1 : 1, x ? -1 : 1), 1.6, 320);
  [160, 300, 440].forEach((delay, i) => setTimeout(() => {
    if (giant?.hits !== hit) return; // the next corner already hit
    // Chain explosions along the two walls that meet at this corner.
    const alongTop = i % 2 === 0;
    const reachAlong = 0.3 + 0.25 * i;
    const chainX = alongTop ? Math.abs(x - innerWidth * reachAlong) : x;
    const chainY = alongTop ? y : Math.abs(y - innerHeight * reachAlong);
    domes.push({ start: performance.now(), x: chainX, y: chainY, radius: reach * 0.4, puffs: null });
    shakeStage(Math.random() < 0.5 ? -1 : 1, Math.random() < 0.5 ? -1 : 1, 30);
    playThump(1.4);
  }, delay));
}

// A dome blows out fast, holds and boils, then breaks into puffs of its own
// colors that drift off and shrink away.
function drawDome(dome, now) {
  const t = since(dome.start, now);
  const { x, y, radius } = dome;
  if (t < DOME_EXPAND_MS + DOME_HOLD_MS) {
    const grow = 1 - (1 - Math.min(1, t / DOME_EXPAND_MS)) ** 4;
    const boil = t > DOME_EXPAND_MS ? 1 + 0.03 * Math.sin(t / 30) : 1;
    for (const [scale, color] of DOME_LAYERS) jaggedCircle(burst, x, y, radius * grow * scale * boil, 0.12, color, 40);
    return;
  }
  if (!dome.puffs) {
    dome.puffs = Array.from({ length: 50 }, () => {
      const distance = radius * Math.sqrt(Math.random());
      const angle = Math.random() * Math.PI * 2;
      const layer = DOME_LAYERS.findLast(([scale]) => distance <= radius * scale) ?? DOME_LAYERS[0];
      return {
        x: x + Math.cos(angle) * distance,
        y: y + Math.sin(angle) * distance,
        vx: Math.cos(angle) * (40 + Math.random() * 90),
        vy: Math.sin(angle) * (40 + Math.random() * 90) - 30,
        size: radius * (0.1 + Math.random() * 0.1),
        layer: DOME_LAYERS.indexOf(layer),
        color: layer[1],
      };
    }).sort((a, b) => a.layer - b.layer);
  }
  const fade = Math.min(1, (t - DOME_EXPAND_MS - DOME_HOLD_MS) / DOME_FADE_MS);
  const elapsed = (t - DOME_EXPAND_MS - DOME_HOLD_MS) / 1000;
  for (const puff of dome.puffs) {
    burst.fillStyle = puff.color;
    burst.beginPath();
    burst.arc(puff.x + puff.vx * elapsed, puff.y + puff.vy * elapsed, puff.size * (1 - fade) ** 1.5, 0, Math.PI * 2);
    burst.fill();
  }
  if (fade === 1) domes.splice(domes.indexOf(dome), 1);
}

// The second explosion: the screen splits into wedges fanning out from the
// corner, strobing through loud colors, then the shards fly apart and fall.
function startShatter(x, y) {
  const inward = Math.atan2(y ? -1 : 1, x ? -1 : 1);
  const count = 18;
  const edges = Array.from({ length: count + 1 }, (_, i) => {
    const jitter = i === 0 || i === count ? 0 : (Math.random() - 0.5) * 0.06;
    return inward - Math.PI / 4 - 0.1 + ((Math.PI / 2 + 0.2) * i) / count + jitter;
  });
  shatter = {
    start: performance.now(),
    x,
    y,
    reach: Math.hypot(innerWidth, innerHeight) * 1.1,
    shards: edges.slice(0, -1).map((from, i) => {
      const middle = (from + edges[i + 1]) / 2;
      const kick = 300 + Math.random() * 700;
      return { from, to: edges[i + 1], color: i, vx: Math.cos(middle) * kick, vy: Math.sin(middle) * kick - 200, spin: (Math.random() - 0.5) * 6 };
    }),
  };
  if (reduceMotion) return;
  shakeStage(x ? 1 : -1, y ? 1 : -1, 80);
  rings.push({ x, y, radius: 0, speed: 3800, width: 56, color: "#000" });
  rings.push({ x, y, radius: 0, speed: 2600, width: 30, color: "#fff" });
  spray(x, y, inward, 1.6, 420);
  setTimeout(shrinkGiant, SHATTER_HOLD_MS + 250);
}

function drawShatter(now) {
  const t = since(shatter.start, now);
  const { x, y, reach, shards } = shatter;
  const strobe = Math.floor(t / 45);
  const flying = t > SHATTER_HOLD_MS;
  const fly = flying ? Math.min(1, (t - SHATTER_HOLD_MS) / SHATTER_FLY_MS) : 0;
  const elapsed = flying ? (t - SHATTER_HOLD_MS) / 1000 : 0;
  const open = Math.min(1, t / 110);
  shards.forEach((shard, i) => {
    const r = reach * open;
    const ax = Math.cos(shard.from) * r;
    const ay = Math.sin(shard.from) * r;
    const bx = Math.cos(shard.to) * r;
    const by = Math.sin(shard.to) * r;
    const cx = (ax + bx) / 3;
    const cy = (ay + by) / 3;
    const scale = 1 - fly;
    burst.save();
    burst.translate(x + cx + shard.vx * elapsed, y + cy + shard.vy * elapsed + 0.5 * GRAVITY * elapsed * elapsed);
    burst.rotate(shard.spin * elapsed);
    burst.scale(scale, scale);
    burst.fillStyle = SHARD_COLORS[(shard.color + (flying ? 0 : strobe)) % SHARD_COLORS.length];
    burst.beginPath();
    burst.moveTo(-cx, -cy);
    burst.lineTo(ax - cx, ay - cy);
    burst.lineTo(bx - cx, by - cy);
    burst.fill();
    burst.restore();
  });
  if (fly === 1) shatter = null;
}

// Out of the wreckage, the giant shrinks into a normal logo that keeps going.
function shrinkGiant() {
  const { element, svg, left, top } = giant;
  const normalScale = logoWidth / giant.width;
  element.style.color = COLORS[1];
  svg.style.transformOrigin = `${left ? 0 : 100}% ${top ? 0 : 100}%`;
  svg.animate(
    [{ transform: "scale(1)" }, { transform: `scale(${normalScale * 0.8})`, offset: 0.7 }, { transform: `scale(${normalScale})` }],
    { duration: reduceMotion ? 1 : 700, easing: "ease-in", fill: "forwards" }
  ).finished.then(() => {
    element.remove();
    giant = null;
    const logo = addLogo(left ? 0 : width, top ? 0 : height);
    logo.boost = RICOCHET_BOOST;
    mode = "play";
  });
}

// ---- Main loop ----

function tick(now) {
  const seconds = Math.max(0, Math.min((now - lastTime) / 1000, MAX_FRAME_SECONDS));
  lastTime = now;
  if (mode === "play") {
    if (jackpot) advanceJackpot(seconds);
    for (const logo of logos) moveLogo(logo, seconds);
    if (jackpot && jackpot.logos.size === 0) jackpotFinale();
  }
  if (giant?.growth) growGiant(now);
  if (giant?.leg) moveGiant(now);
  renderAura(now, seconds);
  renderEffects(now, seconds);
  requestAnimationFrame(tick);
}

addEventListener("resize", () => {
  const folded = logos.map((logo) => [fold(logo.x, width), fold(logo.y, height)]);
  measure();
  logos.forEach((logo, i) => {
    logo.x = Math.min(folded[i][0], width);
    logo.y = Math.min(folded[i][1], height);
    startRun(logo);
    draw(logo);
  });
  if (jackpot) startJackpot();
});

// Every click drops in another logo, centered on the pointer.
addEventListener("pointerdown", (event) => {
  if (event.target.closest("button, a") || mode !== "play") return;
  const x = Math.min(Math.max(event.clientX - logoWidth / 2, 0), width);
  const y = Math.min(Math.max(event.clientY - logoHeight / 2, 0), height);
  popIn(addLogo(x, y).svg);
  if (logos.length >= OVERLOAD_LOGOS) startJam();
});

// Embedded in another page, the about page opens in a new tab instead of replacing the screensaver
if (window.self !== window.top) {
  const aboutLink = document.getElementById("about");
  aboutLink.target = "_blank";
  aboutLink.rel = "noopener";
}

// ---- Sound ----

let soundOn = false;
let audio;
let sounds;
let lastCheer = -1;

async function loadSound(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Could not load ${url}: ${response.status}`);
  return audio.decodeAudioData(await response.arrayBuffer());
}

async function loadSounds() {
  const entries = await Promise.all(Object.entries(SOUND_FILES).map(async ([name, source]) =>
    [name, Array.isArray(source) ? await Promise.all(source.map(loadSound)) : await loadSound(source)]));
  return Object.fromEntries(entries);
}

const SOUND_ICONS = {
  on: "M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13",
  off: "M16 9l5 6M21 9l-5 6",
};

soundButton.addEventListener("click", async () => {
  soundOn = !soundOn;
  soundButton.querySelector(".icon-detail").setAttribute("d", soundOn ? SOUND_ICONS.on : SOUND_ICONS.off);
  soundButton.setAttribute("aria-label", soundOn ? "Turn sound off" : "Turn sound on");
  if (!soundOn) return;
  audio ??= new AudioContext();
  await audio.resume();
  sounds ??= await loadSounds();
});

function playSound(buffer, { delay = 0, gain = 0.8, rate = 1, rateTo, rampSeconds = 1 } = {}) {
  if (!soundOn || !buffer) return;
  const source = audio.createBufferSource();
  const level = audio.createGain();
  source.buffer = buffer;
  source.playbackRate.setValueAtTime(rate, audio.currentTime + delay);
  if (rateTo) source.playbackRate.linearRampToValueAtTime(rateTo, audio.currentTime + delay + rampSeconds);
  level.gain.value = gain;
  source.connect(level).connect(audio.destination);
  source.start(audio.currentTime + delay);
}

function playThump(power = 1) {
  if (!soundOn || !audio) return;
  const now = audio.currentTime;
  const thump = audio.createOscillator();
  const level = audio.createGain();
  thump.frequency.setValueAtTime(160 / power, now);
  thump.frequency.exponentialRampToValueAtTime(42 / power, now + 0.18 * power);
  level.gain.setValueAtTime(0.9, now);
  level.gain.exponentialRampToValueAtTime(0.001, now + 0.28 * power);
  thump.connect(level).connect(audio.destination);
  thump.start(now);
  thump.stop(now + 0.3 * power);
}

// One of a few short cheers, never the same twice in a row.
function playCornerSound() {
  if (!sounds) return;
  playThump();
  lastCheer = pickDifferent(sounds.cheers.length, lastCheer);
  playSound(sounds.cheers[lastCheer], { delay: 0.02 });
}

function playJackpotSound() {
  if (!sounds) return;
  playThump(1.3);
  playSound(sounds.giantImpact, { gain: 0.6 });
  sounds.cheers.forEach((cheer, i) => playSound(cheer, { delay: 0.02 + i * 0.06, gain: 0.55 }));
}

function playJamSound() {
  if (!sounds) return;
  playSound(sounds.jamWarble, { gain: 0.7 });
  playSound(sounds.jamStutter, { delay: 0.55, gain: 0.7 });
  playSound(sounds.jamStutter, { delay: 0.95, gain: 0.7, rate: 0.8 });
}

// A low rumble and a whine that climb while the ball charges, then cut out
// dead at the squeeze, so the held moment is silent.
function playChargeSound() {
  if (!sounds) return;
  const now = audio.currentTime;
  const seconds = CHARGE_MS / 1000;
  const rumble = audio.createOscillator();
  const rumbleFilter = audio.createBiquadFilter();
  const rumbleLevel = audio.createGain();
  rumble.type = "sawtooth";
  rumble.frequency.setValueAtTime(40, now);
  rumble.frequency.exponentialRampToValueAtTime(140, now + seconds);
  rumbleFilter.type = "lowpass";
  rumbleFilter.frequency.value = 380;
  rumbleLevel.gain.setValueAtTime(0.001, now);
  rumbleLevel.gain.exponentialRampToValueAtTime(0.5, now + seconds);
  rumble.connect(rumbleFilter).connect(rumbleLevel).connect(audio.destination);
  const whine = audio.createOscillator();
  const whineLevel = audio.createGain();
  whine.frequency.setValueAtTime(260, now);
  whine.frequency.exponentialRampToValueAtTime(1300, now + seconds);
  whineLevel.gain.setValueAtTime(0.001, now);
  whineLevel.gain.exponentialRampToValueAtTime(0.06, now + seconds);
  whine.connect(whineLevel).connect(audio.destination);
  for (const oscillator of [rumble, whine]) {
    oscillator.start(now);
    oscillator.stop(now + seconds);
  }
}

function playBounceCornerSound() {
  if (!sounds) return;
  playThump(2.2);
  playSound(sounds.giantImpact, { gain: 0.9 });
  lastCheer = pickDifferent(sounds.cheers.length, lastCheer);
  playSound(sounds.cheers[lastCheer], { delay: 0.05, gain: 0.7 });
}

// The rumble comes back while the giant winds up in the middle, and cuts out
// as it starts to drift.
function playWindUpSound() {
  if (!sounds) return;
  const now = audio.currentTime;
  const seconds = WINDUP_MS / 1000;
  const rumble = audio.createOscillator();
  const level = audio.createGain();
  rumble.type = "sawtooth";
  rumble.frequency.setValueAtTime(50, now);
  rumble.frequency.exponentialRampToValueAtTime(220, now + seconds);
  level.gain.setValueAtTime(0.001, now);
  level.gain.exponentialRampToValueAtTime(0.25, now + seconds);
  rumble.connect(level).connect(audio.destination);
  rumble.start(now);
  rumble.stop(now + seconds);
}

// A deep drone under the leviathan for as long as it drifts.
function playLeviathanSound() {
  if (!sounds) return;
  const now = audio.currentTime;
  const drone = audio.createOscillator();
  const filter = audio.createBiquadFilter();
  const level = audio.createGain();
  drone.type = "sawtooth";
  drone.frequency.value = 38;
  filter.type = "lowpass";
  filter.frequency.value = 220;
  level.gain.setValueAtTime(0.001, now);
  level.gain.exponentialRampToValueAtTime(0.35, now + 0.6);
  drone.connect(filter).connect(level).connect(audio.destination);
  drone.start(now);
  giant.drone = drone;
}

function playFireSound() {
  if (!sounds) return;
  playThump(1);
  playSound(sounds.mergeWhoosh, { gain: 1, rate: 2.2 });
}

function playGiantSound() {
  if (!sounds) return;
  playThump(3);
  playSound(sounds.giantImpact, { gain: 1 });
  playSound(sounds.giantImpact, { delay: 0.04, gain: 0.9, rate: 0.5 });
  playSound(sounds.giantHorn, { delay: 0.05, gain: 0.7 });
  sounds.cheers.forEach((cheer, i) => playSound(cheer, { delay: 0.1 + i * 0.08, gain: 0.6 }));
}

// ---- Full screen, keep awake, keys, idle ----

const FULLSCREEN_ICONS = {
  enter: "M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5",
  exit: "M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5",
};

fullscreenButton.hidden = !document.fullscreenEnabled;
fullscreenButton.addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});
document.addEventListener("fullscreenchange", () => {
  const full = Boolean(document.fullscreenElement);
  fullscreenButton.querySelector(".icon-detail").setAttribute("d", full ? FULLSCREEN_ICONS.exit : FULLSCREEN_ICONS.enter);
  fullscreenButton.setAttribute("aria-label", full ? "Exit full screen" : "Full screen");
});

// Like a real screensaver, don't let the display go to sleep.
async function keepScreenAwake() {
  if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  try {
    await navigator.wakeLock.request("screen");
  } catch (error) {
    console.warn("Could not keep the screen awake:", error.message);
  }
}
document.addEventListener("visibilitychange", keepScreenAwake);
keepScreenAwake();

addEventListener("keydown", (event) => {
  if (event.key === "s" || event.key === "S") soundButton.click();
  if ((event.key === "f" || event.key === "F") && document.fullscreenEnabled) fullscreenButton.click();
});

// Hide the cursor and buttons after a few still seconds.
// The controls stay up longer on arrival so people notice them.
let idleTimer;
function wake(delay = 2500) {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), delay);
}
addEventListener("pointermove", () => wake());
addEventListener("keydown", () => wake());
wake(6000);

// Read-only peek at the state, plus a way to force the rare event, for the test suite.
if (new URLSearchParams(location.search).has("test")) {
  window.nothingButCorners = {
    get mode() { return mode; },
    get corners() { return corners; },
    get jackpotActive() { return Boolean(jackpot); },
    get soundsLoaded() { return Boolean(sounds); },
    get bounds() { return { width, height }; },
    get logos() { return logos.map((logo) => ({ x: fold(logo.x, width), y: fold(logo.y, height), color: logo.element.style.color })); },
    startJackpot,
  };
}

document.fonts.ready.then(() => {
  measure();
  addLogo(0, 0);
  lastTime = performance.now();
  requestAnimationFrame(tick);
});
</script>
